# =============================================================================
# BUILD SYSTEM
# =============================================================================

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# PROJECT METADATA
# =============================================================================

[project]
name = "tinynpydb"
version = "0.1.2"
description = "Tiny pickle-based array database"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "QuatroPE", email = "bruno.sanchez@duke.edu"}
]
keywords = ["numpy", "database", "pickle", "array"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/quatrope/tinynpydb"
Repository = "https://github.com/quatrope/tinynpydb"
Issues = "https://github.com/quatrope/tinynpydb/issues"

# =============================================================================
# SETUPTOOLS CONFIGURATION
# =============================================================================

[tool.setuptools]
py-modules = ["tinynpydb"]

# =============================================================================
# BLACK
# =============================================================================

[tool.black]
line-length = 79
target-version = ["py39", "py310", "py311", "py312"]

# =============================================================================
# PYTEST
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests.py"]
python_files = ["tests.py"]
addopts = "-v"

# =============================================================================
# COVERAGE
# =============================================================================

[tool.coverage.run]
source = ["tinynpydb"]
omit = ["tests.py", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
