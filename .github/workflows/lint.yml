name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy numpy
    
    - name: Run flake8
      run: |
        flake8 tinynpydb.py tests.py --max-line-length=88 --extend-ignore=E203
    
    - name: Check formatting with black
      run: |
        black --check --line-length=79 tinynpydb.py tests.py
    
    - name: Run mypy
      run: |
        mypy tinynpydb.py --ignore-missing-imports
      continue-on-error: true
